name: Daily Bhakti Video Automation

on:
  schedule:
    - cron: '0 0 * * *'  # रोज़ाना ऑटोमैटिक रन के लिए
  workflow_dispatch:      # GitHub से मैन्युअल रन करने के लिए
  repository_dispatch:    # n8n Webhook (build_video) ट्रिगर के लिए
    types: [build_video, n8n_trigger]

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg & ImageMagick)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick

      - name: Configure ImageMagick Security Policy
        run: |
          sudo sed -i 's/policy domain="path" rights="none" pattern="@*"/<!-- policy domain="path" rights="none" pattern="@*" -->/' /etc/ImageMagick-6/policy.xml

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Video Automation Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python main.py
        
