name: CI Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Dependency caching for faster builds

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Script with Secrets
        env:
          # यहाँ अपने Secrets के सही नाम जोड़ें
          MY_TOKEN: ${{ secrets.MY_TOKEN }}
          TG_BOT: ${{ secrets.TG_BOT }}
        run: |
          python main.py
          
