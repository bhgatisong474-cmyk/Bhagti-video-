name: Daily Bhakti Video Automation
run-name: Bhakti ${{ github.event.schedule }}

on:
  # Roz 2 video, sirf GitHub se (n8n ki zaroorat nahi):
  schedule:
    - cron: '30 23 * * *'   # subah 5:00 IST  -> video 1 (lamba)
    - cron: '0 13 * * *'    # shaam 6:30 IST  -> video 2 (chhota)
  # Haath se chalane ke liye (Actions -> Run workflow)
  workflow_dispatch:
    inputs:
      slot:
        description: 'Kaun sa video: 0 = subah (lamba), 1 = shaam (chhota)'
        type: choice
        default: '0'
        options: ['0', '1']
  # (Optional) bahar se trigger
  repository_dispatch:
    types: [build_video, n8n_trigger]

permissions:
  contents: read
  actions: write

concurrency:
  group: bhakti-video
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.c.outputs.skip }}
      slot: ${{ steps.c.outputs.slot }}
    steps:
      - name: Kaun sa video hai aur kya wo aaj pehle ban chuka hai?
        id: c
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          INPUT_SLOT: ${{ github.event.inputs.slot }}
          REPO: ${{ github.repository }}
        run: |
          SLOT=0
          if [ "$EVENT" = "schedule" ]; then
            if [ "$CRON" = "0 13 * * *" ]; then SLOT=1; fi
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            SLOT="${INPUT_SLOT:-0}"
          fi
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"

          SKIP=no
          if [ "$EVENT" = "schedule" ]; then
            TODAY=$(TZ=Asia/Kolkata date +%F)
            START=$(date -u -d "$TODAY 00:00 +0530" +%Y-%m-%dT%H:%M:%SZ)
            COUNT=$(gh api -X GET "repos/$REPO/actions/workflows/main.yml/runs" \
              -f status=success -f created=">=$START" -f per_page=100 \
              | python3 -c "import sys, json, os; k = os.environ['CRON']; d = json.load(sys.stdin); print(len([r for r in d.get('workflow_runs', []) if k in (r.get('display_title') or '')]))" || echo 0)
            echo "Is slot ($CRON) ke aaj ke successful runs: ${COUNT:-0}"
            if [ "${COUNT:-0}" -gt 0 ]; then SKIP=yes; fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - name: Schedule ko 60 din wali band hone se bachao (keep-alive)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/main.yml/enable" || true

  build-and-upload:
    needs: check
    if: needs.check.outputs.skip != 'yes'
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libraqm0 libfribidi0 libharfbuzz0b fonts-lohit-deva fonts-dejavu-core fonts-noto-core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Video Automation Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          TOPIC: ${{ github.event.client_payload.topic }}
          SLOT: ${{ needs.check.outputs.slot }}
          VIDEOS_PER_DAY: "2"
          PYTHONUNBUFFERED: "1"
        run: |
          python main.py || (echo "Pehli koshish fail, 5 minute baad dobara..." && sleep 300 && python main.py)
