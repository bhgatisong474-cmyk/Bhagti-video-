name: Daily Bhakti Video Automation

on:
  schedule:
    - cron: '30 0 * * *'  # 6:00 AM IST
  workflow_dispatch:
  repository_dispatch:
    types: [build_video, n8n_trigger]

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libavcodec-extra libfribidi0 libharfuzz0 fonts-lohit-deva fonts-dejavu fonts-noto-core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Video Automation Script
        env:
          # Secrets se environment variables
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          
          # Optional - Pexels ke liye (real photos ke liye)
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          
          # Settings (zyada se zyada 20 minute tak)
          CHANNEL_NAME: 'भक्ति विचार'
          MIN_MINUTES: '10'
          MAX_MINUTES: '20'
          BGM_VOLUME: '0.12'
          PRIVACY: 'private'
          
          # Topic - n8n webhook ya manual run se aayega, warna default
          TOPIC: ${{ github.event.client_payload.topic || 'आज का भक्ति विचार और प्रेरणा' }}
        run: python main.py

      - name: Upload Output (agar fail ho)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-output
          path: |
            final_video.mp4
            thumbnail.jpg
            work/
          retention-days: 3
